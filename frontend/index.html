    <script>
      window.process = window.process || { env: {} };
      window.global = window.global || window;
      // Gracefully prevent Vite HMR WebSocket disconnect noise from triggering window errors in iframe
      window.addEventListener('error', function (e) {
        if (
          e?.message?.includes?.('WebSocket') ||
          e?.filename?.includes?.('@vite/client') ||
          e?.error?.stack?.includes?.('createWebSocketModuleRunnerTransport')
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e?.reason?.message?.includes?.('WebSocket') ||
          e?.reason?.stack?.includes?.('createWebSocketModuleRunnerTransport') ||
          e?.reason?.stack?.includes?.('@vite/client')
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
